name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      inject_test_failure:
        description: 'P07: absichtlichen pytest-Fehler auslösen (Publish muss ausbleiben)'
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: Fachlich/Anwendung
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Fachlich/Anwendung/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Test-Vorabcheck und pytest
        env:
          INJECT_TEST_FAILURE: ${{ inputs.inject_test_failure || false }}
        run: |
          args=()
          if [ "$INJECT_TEST_FAILURE" = "true" ]; then
            args+=(--inject-test-failure)
          fi
          python scripts/ci_tests.py "${args[@]}"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/docker_smoke.py

  publish:
    needs: [test, container]
    if: >-
      github.repository == 'lusaegesser/semesterarbeit-4sem' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image-Namen festlegen
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "commit_tag=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "run_tag=$image:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: GHCR-Anmeldung
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Geprüftes Commit-Image veröffentlichen
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: Fachlich/Anwendung
          push: true
          tags: |
            ${{ steps.image.outputs.commit_tag }}
            ${{ steps.image.outputs.run_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Veröffentlichungsnachweis schreiben
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          RUN_TAG: ${{ steps.image.outputs.run_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "commit": os.environ["GITHUB_SHA"],
              "run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "image": os.environ["IMAGE"],
              "commit_tag": os.environ["COMMIT_TAG"],
              "run_tag": os.environ["RUN_TAG"],
              "digest": os.environ["DIGEST"],
          }
          if not evidence["digest"].startswith("sha256:"):
              raise RuntimeError("Kein Image-Digest vorhanden")
          Path("publish-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## GHCR-Veröffentlichung\n\n```json\n" + json.dumps(evidence, indent=2) + "\n```\n")
          PY
      - name: Nachweis als Laufartefakt sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publish-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-evidence.json
          if-no-files-found: error

  verify-negative-publish:
    needs: [test, container, publish]
    if: >-
      always() && github.repository == 'lusaegesser/semesterarbeit-4sem' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      inputs.inject_test_failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Fehlgeschlagene Tests und gesperrten Publish prüfen
        working-directory: ${{ runner.temp }}
        env:
          TEST_RESULT: ${{ needs.test.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$TEST_RESULT" = failure
          test "$CONTAINER_RESULT" = success
          test "$PUBLISH_RESULT" = skipped
      - name: GHCR lesend anmelden
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Vorhandenes Image und fehlenden Versuchstag prüfen
        env:
          REPOSITORY: ${{ github.repository }}
        working-directory: ${{ runner.temp }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          control="$image:sha-$GITHUB_SHA"
          absent="$image:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools inspect "$control" > control-image.txt
          if docker buildx imagetools inspect "$absent" > missing-image.txt 2>&1; then
            echo "FEHLER: negativer Versuch wurde veröffentlicht"
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|not found' missing-image.txt; then
            cat missing-image.txt
            echo "Registry-Fehler belegt keinen fehlenden Tag"
            exit 1
          fi
          {
            echo "PASS: test=failure, container=success, publish=skipped"
            echo "Lesbare Kontrolle: $control"
            echo "Fehlender Versuchstag: $absent"
            cat control-image.txt
            cat missing-image.txt
          } > negative-publish-evidence.txt
          cat negative-publish-evidence.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Negativen Registry-Nachweis sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: negative-publish-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/negative-publish-evidence.txt
          if-no-files-found: error
